name: Test and deploy

# Tests run on every pull request and on every push to main. A push to main
# deploys to GitHub Pages only after the tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp this release: the pages carry the version they were built as,
      # and version.json says what is newest, so an open app can tell when
      # it is out of date.
      - name: Stamp version
        run: |
          V="${GITHUB_SHA::7}"
          D="$(date -u +%Y-%m-%d)"
          echo "{ \"version\": \"$V\", \"date\": \"$D\" }" > version.json
          sed -i "s|<meta name=\"prism-version\" content=\"dev\" data-date=\"\" />|<meta name=\"prism-version\" content=\"$V\" data-date=\"$D\" />|" index.html help.html settings.html
          # A page left unstamped would always look out of date: stop instead.
          for f in index.html help.html settings.html; do
            grep -q "content=\"$V\"" "$f" || { echo "version not stamped in $f"; exit 1; }
          done
          cat version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
