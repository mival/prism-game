<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c0f" />
    <title>Prism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="title">
          <span class="eyebrow" id="levelNo">LEVEL 01</span>
          <h1 id="levelName">First Light</h1>
        </div>
        <div class="meta">
          <nav class="levels" id="levels" aria-label="Levels"></nav>
          <div class="meta-row">
            <span class="lit" id="lit">0 / 1 lit</span>
            <button
              class="icon-btn"
              id="reset"
              type="button"
              aria-label="Reset level"
              title="Reset level"
            >
              ↺
            </button>
          </div>
        </div>
      </header>

      <div class="status" id="status" aria-live="polite">
        <p id="statusText"></p>
        <button class="next" id="next" type="button" hidden>
          Next level →
        </button>
      </div>

      <div class="stage" id="stage">
        <canvas id="board" role="img" aria-label="Puzzle board"></canvas>
      </div>

      <div class="tray" id="tray" aria-label="Pieces"></div>
    </div>

    <script src="src/js/logic.js"></script>
    <script src="src/js/render.js"></script>
    <script src="src/js/main.js"></script>
  </body>
</html>
