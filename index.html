<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c0f" />
    <title>Prism</title>
    <script>
      try {
        var saved = localStorage.getItem("prism.theme");
        if (saved === "light" || saved === "dark")
          document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c0f'/%3E%3Cpath d='M16 6 L27 25 H5 Z' fill='none' stroke='%23c8d1db' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M16 6 L27 25' stroke='%233d7bff' stroke-width='2.2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="src/css/theme.css" />
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="title">
          <span class="eyebrow" id="levelNo">LEVEL 01 / 25</span>
          <h1 id="levelName">First Light</h1>
        </div>
        <div class="meta">
          <button
            class="icon-btn"
            id="hint"
            type="button"
            aria-label="Hint: place one piece correctly"
            title="Hint: place one piece correctly"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="reset"
            type="button"
            aria-label="Reset level"
            title="Reset level"
          >
            ↺
          </button>
          <a
            class="icon-btn"
            id="help"
            href="help.html"
            aria-label="How to play"
            title="How to play"
            >?</a
          >
          <button
            class="icon-btn"
            id="theme"
            type="button"
            aria-label="Theme: auto"
            title="Theme: auto"
          >
            ◐
          </button>
        </div>
      </header>

      <nav class="levelbar" aria-label="Levels">
        <button
          class="icon-btn"
          id="prevLevel"
          type="button"
          aria-label="Previous level"
        >
          ‹
        </button>
        <button
          class="levels-btn"
          id="levelsBtn"
          type="button"
          aria-haspopup="dialog"
        >
          <span class="lbl">Levels</span
          ><span class="done-count" id="doneCount">0 / 25 done</span>
        </button>
        <button
          class="icon-btn"
          id="nextLevel"
          type="button"
          aria-label="Next level"
        >
          ›
        </button>
        <span class="lit" id="lit">0 / 1 lit</span>
      </nav>

      <div class="status" id="status" aria-live="polite">
        <p id="statusText"></p>
        <button class="next" id="next" type="button" hidden>
          Next level →
        </button>
      </div>

      <div class="stage" id="stage">
        <canvas id="board" role="img" aria-label="Puzzle board"></canvas>
      </div>

      <div class="tray" id="tray" aria-label="Pieces"></div>
    </div>

    <dialog id="levelDialog" aria-labelledby="levelDialogTitle">
      <form method="dialog" class="dialog-head">
        <h2 id="levelDialogTitle">Levels</h2>
        <button class="icon-btn" type="submit" aria-label="Close">✕</button>
      </form>
      <section class="endless" aria-labelledby="endlessTitle">
        <h2 id="endlessTitle">Endless</h2>
        <p>New levels, made on the spot. Each one has a code you can share.</p>
        <div class="diff-row">
          <button class="diff" type="button" data-diff="easy">
            Easy<span class="solved">0 solved</span>
          </button>
          <button class="diff" type="button" data-diff="medium">
            Medium<span class="solved">0 solved</span>
          </button>
          <button class="diff" type="button" data-diff="hard">
            Hard<span class="solved">0 solved</span>
          </button>
        </div>
        <form class="code-row" id="codeForm">
          <label for="codeInput">Level code</label>
          <input
            id="codeInput"
            name="code"
            placeholder="M-48213"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
          />
          <button type="submit">Play</button>
        </form>
        <p class="code-error" id="codeError" hidden>
          That code doesn't make a level. Codes are E, M or H, then a dash and a
          number, like M-48213.
        </p>
        <p class="current-code" id="currentCode" hidden>
          This level: <b id="codeText"></b>
          <button type="button" id="copyCode">Copy link</button>
        </p>
      </section>

      <div class="level-grid" id="levelGrid"></div>
    </dialog>

    <script src="src/js/logic.js"></script>
    <script src="src/js/render.js"></script>
    <script src="src/js/generator.js"></script>
    <script src="src/js/main.js"></script>
  </body>
</html>
